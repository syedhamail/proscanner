{% extends "base.html" %}
{% block title %}Resend Verification — Pro Scanner{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="wrap auth-wrap">
    <div class="auth-card reveal">
      <span class="section-tag">// VERIFICATION</span>
      <h1>Resend verification link</h1>
      <p class="auth-sub">Enter your email and we'll send you a new verification link.</p>

      <form method="POST" action="{{ url_for('resend_verification') }}">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send Link</button>
      </form>

      <p class="auth-switch">Back to <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
  </div>
</section>
{% endblock %}
